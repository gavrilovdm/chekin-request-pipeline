name: chekin-pipeline

x-app: &app
  build: .
  image: chekin-pipeline:dev
  restart: unless-stopped
  environment: &app-env
    PIPELINE_DATABASE_URL: postgresql://pipeline:pipeline@postgres:5432/pipeline
    PIPELINE_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    PIPELINE_DOWNSTREAM_URL: http://downstream-mock:8081
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

services:
  api:
    <<: *app
    command: ["uvicorn", "pipeline.main:api_app", "--factory", "--host", "0.0.0.0", "--port", "8080",
              "--no-access-log"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "pipeline", "worker"]
    stop_grace_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      downstream-mock: {condition: service_healthy}

  downstream-mock:
    image: chekin-pipeline:dev
    build: .
    command: ["uvicorn", "mock_downstream.app:app", "--host", "0.0.0.0", "--port", "8081", "--no-access-log"]
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    command: ["postgres", "-c", "max_connections=300", "-c", "synchronous_commit=on"]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 40
